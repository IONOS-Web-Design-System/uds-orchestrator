# Plan B — push-based skills sync. ACTIVE.
#
# The VM has no github egress, so we can't `git fetch` on the host. Instead this
# job (on a connected-machine self-hosted runner) checks out the released tag
# here and PUSHES the skills to the VM over SSH (tar | ssh). The agent-svc
# container bind-mounts /opt/pipeline/uds-orchestrator read-only.
# Companion (parked): sync-to-pipeline-host.yml.disabled (Plan A pull-on-host).
# Plan: agent-svc/docs/superpowers/plans/2026-06-02-prod-deploy-sideload.md
name: sync-sideload
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Tag or commit to sync (defaults to latest release)'
        required: false

jobs:
  sync:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Resolve ref to sync
        id: ref
        run: |
          if [ -n "${{ inputs.git_ref }}" ]; then
            echo "value=${{ inputs.git_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          known_hosts: ${{ vars.PIPELINE_HOST_KNOWN_HOSTS }}

      - name: Push skills to the VM (clear-in-place keeps the bind-mount inode stable)
        run: |
          # Record the synced version for provenance — the VM copy has no .git.
          echo "${{ steps.ref.outputs.value }}" > .skills-version
          tar czf - --exclude=.git --exclude=node_modules . \
            | ssh -o StrictHostKeyChecking=yes deploy@${{ vars.PIPELINE_HOST }} \
              'mkdir -p /opt/pipeline/uds-orchestrator && find /opt/pipeline/uds-orchestrator -mindepth 1 -delete && tar xzf - -C /opt/pipeline/uds-orchestrator'

      - name: Verify
        run: |
          ssh -o StrictHostKeyChecking=yes deploy@${{ vars.PIPELINE_HOST }} \
            'echo -n "synced: "; cat /opt/pipeline/uds-orchestrator/.skills-version; echo -n "SKILL.md files: "; find /opt/pipeline/uds-orchestrator -name SKILL.md | wc -l'
          # Skills are read per /generate job; for certainty after a sync you may
          # restart agent-svc: ssh deploy@host 'docker restart pipeline-agent-svc'
